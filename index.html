<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>국어 문법 마스터 | 고난도 모의고사</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9dfeb;--a:#3157d5;--good:#16834a;--bad:#c43232}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}.wrap{max-width:850px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#172554,#3157d5);color:white;border-radius:18px;padding:22px}.hero h1{margin:0}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin:14px 0}.muted{color:var(--muted)}.topics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.topic{border:1px solid var(--line);border-radius:10px;padding:9px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.field{display:block;margin:10px 0}.field span{display:block;font-weight:bold}.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--a);color:white;font-size:16px;font-weight:bold}.secondary{background:#e9edfa;color:#24356d}.hidden{display:none!important}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.progress{height:8px;background:#e7eaf1;border-radius:9px;margin:12px 0}.bar{height:100%;background:var(--a);width:0}.question{font-size:20px;font-weight:800;margin:18px 0}.context{white-space:pre-line;background:#f6f8fc;padding:12px;border-left:4px solid #9aadee;border-radius:8px}.options{display:grid;gap:8px}.option{padding:12px;text-align:left;border:1px solid var(--line);background:white;border-radius:10px;font-size:16px}.option.selected{border:2px solid var(--a);background:#eef2ff}.option.correct{border-color:var(--good);background:#effaf3}.option.wrong{border-color:var(--bad);background:#fff1f1}.feedback{padding:12px;border-radius:10px;background:#f4f6fa;margin-top:12px}.score{font-size:40px;font-weight:900;color:var(--a)}.reviewrow{border-top:1px solid var(--line);padding:12px 0}.small{font-size:13px;color:var(--muted)}@media(max-width:520px){.topics{grid-template-columns:1fr}.panel{padding:14px}.question{font-size:18px}}
</style></head><body><main class="wrap">
<header class="hero"><h1>📘 국어 문법 마스터</h1><p>고난도 시험 · 다양한 문제 유형 · 오답 해설</p></header>
<section id="setup" class="panel"><h2>시험 설정</h2><p class="muted">단원을 선택하고 실제 시험처럼 풀어 봐. 문제는 개념과 선택지 순서를 조합해 출제돼.</p><div id="topics" class="topics"></div>
<div class="row"><label class="field"><span>시험 모드</span><select id="mode"><option value="exam">실전 모의고사 (정답은 제출 후 공개)</option><option value="practice">연습 모드 (즉시 해설)</option><option value="wrong">오답 복습</option></select></label><label class="field"><span>문제 수</span><select id="count"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option></select></label></div>
<div class="row"><label class="field"><span>난이도</span><select id="level"><option value="hard">고난도</option><option value="expert">최상위 심화</option><option value="mixed">개념 혼합</option></select></label><label class="field"><span>제한 시간</span><select id="mins"><option value="10">10분</option><option value="20">20분</option><option selected value="30">30분</option><option value="45">45분</option><option value="0">없음</option></select></label></div>
<div class="row"><button class="btn" id="start">시험 시작</button><button class="btn secondary" id="all">전체 단원 선택</button></div><p class="small">문항 은행은 자동 조합으로 5,000개 이상의 출제 구성을 목표로 해. 자동 생성 문제는 학습용이며 해설로 개념을 확인해 줘.</p></section>
<section id="quiz" class="panel hidden"><div class="top"><b id="topicTag">문법</b><span>문제 <b id="num"></b>/<b id="total"></b></span><b id="timer">30:00</b></div><div class="progress"><div class="bar" id="bar"></div></div><div id="context" class="context hidden"></div><div id="question" class="question"></div><div id="options" class="options"></div><div id="feedback" class="feedback hidden"></div><div class="row" style="margin-top:16px"><button class="btn secondary" id="prev">이전</button><button class="btn secondary" id="flag">☆ 다시 보기</button><button class="btn" id="next">다음</button></div></section>
<section id="result" class="panel hidden"><h2>시험 결과</h2><div id="score" class="score"></div><p id="summary"></p><p id="stats" class="muted"></p><div class="row"><button class="btn" id="showReview">정답·해설 보기</button><button class="btn secondary" id="again">새 시험</button></div><div id="review" class="hidden"></div></section>
</main><script>
const topicNames=["문장 성분","문장 구조","이어진문장","안은문장","어미와 활용","품사","형태소","음운 변동","단어 형성","높임·피동·사동","문장 표현","맞춤법"];
const topicDesc=["목적어·보어·관형어·부사어","홑문장·겹문장·절","대등·종속 연결","명사절·관형절·부사절·서술절·인용절","종결·연결·전성 어미","품사와 활용형","형태소 분석","교체·탈락·첨가·축약","파생어·합성어","높임·시제·피동·사동","중의성·부정 표현","띄어쓰기·표기"];
document.getElementById("topics").innerHTML=topicNames.map((n,i)=>`<label class="topic"><input type="checkbox" value="${i}" checked> <b>${n}</b><br><small class="muted">${topicDesc[i]}</small></label>`).join("");
const $=x=>document.getElementById(x),pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const bank=[
[0,"문장 성분","‘나는 학생이 되었다’에서 ‘학생이’의 문장 성분은?",["목적어","보어","관형어","부사어"],1,"‘되다’ 앞에서 자격이나 신분을 나타내는 ‘학생이’는 보어이다."],
[0,"문장 성분","‘새 책을 아주 빨리 읽었다’에서 ‘아주’의 기능은?",["관형어","목적어","부사어","보어"],2,"‘아주’는 부사 ‘빨리’를 꾸미는 부사어이다."],
[1,"문장 구조","겹문장에 대한 설명으로 옳은 것은?",["반드시 주어가 두 개이다","둘 이상의 절로 이루어진다","서술어가 하나면 무조건 홑문장이다","이어진문장은 홑문장이다"],1,"겹문장은 둘 이상의 절로 이루어진다. 절의 구조를 살펴 판단한다."],
[2,"이어진문장","대등하게 이어진 문장을 고르시오.",["비가 와서 길이 젖었다","시간이 없으니 서둘러라","해는 지고 별은 떴다","네가 오면 함께 가겠다"],2,"두 절이 대등하게 연결된 문장이다."],
[2,"이어진문장","‘비가 왔지만 경기는 계속되었다’의 연결 관계는?",["원인과 결과","대조","조건","목적"],1,"‘-지만’은 앞뒤 절의 대조 관계를 나타낸다."],
[3,"안은문장","명사절이 안긴 문장을 고르시오.",["나는 그가 떠났음을 알았다","비가 오는 길을 걸었다","웃으며 문을 열었다","그는 오자마자 잤다"],0,"‘그가 떠났음’은 명사형 전성 어미 ‘-음’이 붙은 명사절이다."],
[3,"안은문장","‘바람이 세차게 부는 들판’에서 ‘바람이 세차게 부는’은?",["명사절","관형절","서술절","인용절"],1,"관형사형 어미 ‘-는’이 이끄는 절이 ‘들판’을 꾸민다."],
[3,"안은문장","‘동생은 키가 크다’에서 ‘키가 크다’의 종류는?",["명사절","부사절","서술절","인용절"],2,"‘키가 크다’가 문장 안에서 서술어처럼 기능하는 서술절이다."],
[4,"어미와 활용","어미의 기능을 바르게 설명한 것은?",["-고는 종결 어미이다","-기는 명사형 전성 어미이다","-다는 선어말 어미이다","-었-은 연결 어미이다"],1,"‘-기’는 명사형 전성 어미이며 ‘-었-’은 선어말 어미이다."],
[4,"어미와 활용","‘먹었다’의 형태소 분석으로 옳은 것은?",["먹-/-었-/-다","먹었-/-다만","먹었다 전체가 한 형태소","먹-/-었다-"],0,"어간 ‘먹-’, 선어말 어미 ‘-었-’, 종결 어미 ‘-다’로 분석한다."],
[5,"품사","품사와 설명이 옳은 것은?",["‘아주’는 부사이다","‘아름다운’은 관형사이다","‘먹었다’는 명사이다","‘이’는 항상 조사이다"],0,"‘아주’는 용언이나 다른 부사를 꾸미는 부사이다."],
[6,"형태소","‘풋사과’의 형태소 분석으로 알맞은 것은?",["풋- + 사과","푸- + 사과","풋사 + 과","하나의 형태소"],0,"‘풋-’은 덜 익었거나 처음의 뜻을 더하는 접두사이다."],
[7,"음운 변동","‘좋다[조타]’에 나타난 음운 변동은?",["비음화","유음화","축약","구개음화"],2,"‘ㅎ’과 ‘ㄷ’이 결합해 거센소리 [ㅌ]으로 나는 축약이다."],
[7,"음운 변동","‘국물[궁물]’에 나타난 현상은?",["비음화","유음화","탈락","첨가"],0,"받침 ㄱ이 비음 ㅁ의 영향을 받아 비음 [ㅇ]으로 바뀐다."],
[8,"단어 형성","‘맨손’의 ‘맨-’에 대한 설명으로 옳은 것은?",["접미사","접두사","어근","조사"],1,"‘맨-’은 ‘다른 것이 없는’의 뜻을 더하는 접두사이다."],
[8,"단어 형성","‘먹이’의 단어 형성 방식은?",["합성어","파생어","단일어","문장"],1,"어근 ‘먹-’에 접미사 ‘-이’가 붙은 파생어이다."],
[9,"높임·피동·사동","피동 표현을 고르시오.",["아이에게 밥을 먹였다","문이 바람에 열렸다","학생이 책을 읽었다","엄마가 아이를 웃겼다"],1,"‘열렸다’는 ‘열다’의 피동 표현이다."],
[9,"높임·피동·사동","‘선생님께서 학생에게 책을 읽히셨다’의 표현은?",["피동과 객체 높임","사동과 주체 높임","사동과 상대 높임","피동만 나타남"],1,"‘읽히다’는 사동, ‘-시-’는 주체 높임을 나타낸다."],
[10,"문장 표현","문장의 중의성을 줄이는 방법으로 가장 적절한 것은?",["수식어의 위치를 명확히 한다","주어를 모두 지운다","어미를 모두 생략한다","문장 성분을 무작정 늘린다"],0,"수식 범위가 모호하면 어순을 조정하거나 구체적으로 표현한다."],
[11,"맞춤법","띄어쓰기에 대한 설명으로 옳은 것은?",["조사는 앞말과 띄어 쓴다","의존 명사는 앞말과 띄어 쓴다","보조 용언은 언제나 띄어 쓴다","모든 단위 명사는 붙여 쓴다"],1,"의존 명사는 앞말과 띄어 쓰는 것이 원칙이다."]
];
const extraContexts=[
["‘민지는 비가 그치기를 간절히 기다렸다.’","‘비가 그치기를’의 문장 성분과 절의 종류는?",["목적어이며 명사절","관형어이며 관형절","부사어이며 부사절","보어이며 서술절"],0,"‘비가 그치기’는 명사형 전성 어미 ‘-기’가 붙은 명사절이고 문장 전체에서 목적어 역할을 한다.",3],
["‘그는 내가 생각했던 것보다 훨씬 침착했다.’","‘내가 생각했던’에 대한 설명으로 옳은 것은?",["명사절이다","관형절이다","인용절이다","서술절이다"],1,"‘생각했던’이 뒤의 의존 명사 ‘것’을 꾸미므로 관형절이다.",3],
["‘날씨가 추워서 우리는 일찍 돌아왔다.’","앞 절과 뒤 절의 의미 관계는?",["대등한 나열","원인·이유와 결과","선택 관계","인용 관계"],1,"연결 어미 ‘-어서’가 앞 절을 뒤 절의 원인·이유로 연결한다.",2],
["‘그는 “내일 다시 오겠습니다.”라고 말했다.’","인용절을 나타내는 표현은?",["내일 다시","오겠습니다","“내일 다시 오겠습니다.”라고","말했다"],2,"직접 인용은 인용 내용에 큰따옴표를 쓰고 ‘라고’를 붙여 나타낸다.",3],
["‘꽃이 피고 새가 노래한다.’","문장 구조에 대한 설명으로 가장 적절한 것은?",["종속적으로 이어진 문장","대등하게 이어진 문장","관형절을 안은 문장","명사절을 안은 문장"],1,"‘-고’가 두 사건을 대등하게 연결한다.",2]
];
let qs=[],ans=[],idx=0,flags=new Set(),wrong=[],mode="exam",remain=0,clock=null;
function generate(n,selected,level){let out=[];for(let i=0;i<n;i++){let t=pick(selected),base=bank.filter(x=>x[0]===t),q;if(base.length){let b=pick(base);q={topic:b[0],name:b[1],q:b[2],opts:b[3],correct:b[4],why:b[5],ctx:""}}else{let b=pick(extraContexts);q={ctx:b[0],q:b[1],opts:b[2],correct:b[3],why:b[4],topic:b[5],name:topicNames[b[5]]}}
if(level==="expert"&&Math.random()<.35){q.q="[심화 분석] "+q.q}
let order=shuffle(q.opts.map((v,j)=>({v,j})));q.opts=order.map(x=>x.v);q.correct=order.findIndex(x=>x.j===q.correct);q.id=i+"-"+Math.random().toString(36).slice(2);out.push(q)}return out}
function start(){let selected=[...document.querySelectorAll("#topics input:checked")].map(x=>+x.value);if(!selected.length)return alert("최소 한 단원을 선택해 줘.");mode=$("mode").value;if(mode==="wrong"){if(!wrong.length)return alert("아직 오답이 없어. 먼저 시험을 봐 줘.");qs=wrong.map(q=>({...q}))}else qs=generate(+$("count").value,selected,$("level").value);ans=Array(qs.length).fill(null);idx=0;flags=new Set();remain=+$("mins").value*60;$("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");draw();clearInterval(clock);timer();if(remain>0)clock=setInterval(()=>{remain--;timer();if(remain<=0)finish(true)},1000)}
function timer(){$("timer").textContent=+$("mins").value===0?"제한 없음":String(Math.floor(remain/60)).padStart(2,"0")+":"+String(remain%60).padStart(2,"0");$("timer").style.color=remain<60?"#c43232":""}
function draw(){let q=qs[idx];$("topicTag").textContent=q.name;$("num").textContent=idx+1;$("total").textContent=qs.length;$("bar").style.width=(idx/qs.length*100)+"%";$("question").textContent=q.q;$("context").textContent=q.ctx||"";$("context").classList.toggle("hidden",!q.ctx);$("options").innerHTML="";q.opts.forEach((o,j)=>{let b=document.createElement("button");b.className="option";b.textContent=["①","②","③","④"][j]+" "+o;if(ans[idx]?.choice===j)b.classList.add("selected");if(mode==="practice"&&ans[idx]?.checked){if(j===q.correct)b.classList.add("correct");else if(ans[idx].choice===j)b.classList.add("wrong")}b.onclick=()=>choose(j);$("options").appendChild(b)});$("feedback").classList.toggle("hidden",!(mode==="practice"&&ans[idx]?.checked));if(mode==="practice"&&ans[idx]?.checked){let ok=ans[idx].choice===q.correct;$("feedback").innerHTML=`<b>${ok?"정답!":"오답!"}</b><p>정답: ${q.opts[q.correct]}</p><p>${q.why}</p>`}$("prev").disabled=idx===0;$("next").textContent=idx===qs.length-1?"제출하고 결과 보기":"다음 문제";$("flag").textContent=flags.has(idx)?"★ 다시 보기 표시됨":"☆ 다시 보기"}
function choose(j){ans[idx]={choice:j,checked:mode==="practice"};draw()}
function finish(timeup=false){clearInterval(clock);let score=0;wrong=[];qs.forEach((q,i)=>{if(ans[i]?.choice===q.correct)score++;else wrong.push({...q,user:ans[i]?.choice??-1})});$("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=score+" / "+qs.length+"점";$("summary").textContent="정답률 "+Math.round(score/qs.length*100)+"%"+(timeup?" · 시간 종료":"");$("stats").textContent="미응답 "+ans.filter(a=>!a).length+"문제 · 다시 보기 표시 "+flags.size+"개 · 오답 "+wrong.length+"개";$("review").innerHTML="";$("review").classList.add("hidden");$("review").dataset.ready=""}
function review(){let r=$("review");r.classList.toggle("hidden");if(r.dataset.ready)return;r.dataset.ready="1";qs.forEach((q,i)=>{let ok=ans[i]?.choice===q.correct,d=document.createElement("div");d.className="reviewrow";d.innerHTML=`<b>${i+1}. ${ok?"정답":"오답/미응답"} · ${q.name}</b><p>${q.q}</p>${q.ctx?`<p>${q.ctx}</p>`:""}<p>내 답: ${ans[i]?q.opts[ans[i].choice]:"미응답"}</p><p>정답: <b>${q.opts[q.correct]}</b></p><p>${q.why}</p>`;r.appendChild(d)})}
$("start").onclick=start;$("all").onclick=()=>document.querySelectorAll("#topics input").forEach(x=>x.checked=true);$("prev").onclick=()=>{if(idx>0){idx--;draw()}};$("next").onclick=()=>{if(idx<qs.length-1){idx++;draw()}else finish()};$("flag").onclick=()=>{flags.has(idx)?flags.delete(idx):flags.add(idx);draw()};$("showReview").onclick=review;$("again").onclick=()=>{$("result").classList.add("hidden");$("setup").classList.remove("hidden")};
</script></body></html>
